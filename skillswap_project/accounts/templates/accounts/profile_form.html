
{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/edit_profile.css' %}">
{% endblock %}

{% block content %}

<section class="edit-profile-page">

    <div class="edit-profile-card">

        <div class="edit-profile-heading">

            <div class="edit-profile-icon">
                <svg viewBox="0 0 24 24" fill="none"
                     xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 20H21" stroke="currentColor"
                          stroke-width="1.7" stroke-linecap="round"/>
                    <path d="M16.5 3.5A2.12 2.12 0 0 1 19.5 6.5L8 18L4 19L5 15L16.5 3.5Z"
                          stroke="currentColor" stroke-width="1.7"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>

            <span class="edit-profile-eyebrow">ACCOUNT SETTINGS</span>

            <h2>Edit Your Profile</h2>

            <p>Keep your profile information updated.</p>

        </div>


        <form method="POST" enctype="multipart/form-data"
              class="edit-profile-form">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="edit-profile-actions">

                <button type="submit" class="save-profile-button">
                    Save Changes
                    <span>→</span>
                </button>

                <a href="{% url 'profile' %}" class="cancel-profile-button">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</section>

{% endblock %}
