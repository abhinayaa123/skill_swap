
{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
{% endblock %}

{% block content %}

<section class="register-page">

    <div class="register-card">

        <div class="register-heading">

            <div class="register-brand-mark">
                <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="44" height="44" rx="14" fill="#14532d"/>
                    <circle cx="17" cy="18" r="5" fill="#bbf7d0"/>
                    <circle cx="27" cy="26" r="5" fill="#86efac"/>
                    <path d="M19 23L25 21" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
                </svg>
            </div>

            <span class="register-eyebrow">JOIN OUR COMMUNITY</span>

            <h2>Create Your Account</h2>

            <p>Start sharing your knowledge and discovering new skills.</p>

        </div>


        <form method="POST" enctype="multipart/form-data" class="register-form">

            {% csrf_token %}

            <div class="register-field">
                <label for="full_name">Full Name</label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required
                    value="{{ full_name|default:'' }}"
                >
            </div>


            <div class="register-field">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                    value="{{ email|default:'' }}"
                >
            </div>


           

            <div class="register-field">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                    value="{{ username|default:'' }}"
                >
            </div>


            <div class="register-form-grid">

                <div class="register-field">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >
                </div>

                <div class="register-field">
                    <label for="confirm_password">Confirm Password</label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm password"
                        required
                    >
                </div>

            </div>


            <button type="submit" class="register-submit">
                Create Account
                <span>→</span>
            </button>

        </form>


        <div class="register-login">
            <p>
                Already have an account?
                <a href="{% url 'user_login' %}">Login</a>
            </p>
        </div>


        <div class="register-back">
            <a href="{% url 'guest_home' %}">← Back to Home</a>
        </div>

    </div>

</section>

{% endblock %}
