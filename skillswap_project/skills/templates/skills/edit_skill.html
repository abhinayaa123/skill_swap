
{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/edit_skill.css' %}">
{% endblock %}

{% block content %}

<section class="edit-skill-page">

    <div class="edit-skill-card">

        <div class="edit-skill-icon">
            <svg viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
                <path d="M12 20H21"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"/>
                <path d="M16.5 3.5C17.3284 2.67157 18.6716 2.67157 19.5 3.5C20.3284 4.32843 20.3284 5.67157 19.5 6.5L8 18L4 19L5 15L16.5 3.5Z"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"/>
            </svg>
        </div>

        <div class="edit-skill-heading">
            <span class="edit-skill-eyebrow">MANAGE YOUR SKILLS</span>
            <h1>Edit Skill</h1>
            <p>Update your skill information and keep your profile up to date.</p>
        </div>

        <form method="POST" class="edit-skill-form">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="edit-skill-submit">
                Save Changes
                <span>→</span>
            </button>

        </form>

        <a href="{% url 'profile' %}" class="edit-skill-cancel">
            ← Cancel
        </a>

    </div>

</section>

{% endblock %}
